<!doctype html>
<html lang="zh-CN" class="dark-theme">

<head>
  <title>Local Music</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script>
    // 主题初始化：在 DOM 渲染前应用，避免闪烁
    (function() {
      var mode = localStorage.getItem('theme-mode') || 'dark';
      var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var html = document.documentElement;
      if (!isDark) {
        html.classList.remove('dark-theme');
        html.classList.add('light-theme');
        html.style.backgroundColor = '#ebebeb';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = '#ebebeb';
      }
    })();
  </script>
  <style>
    html {
      color-scheme: dark;
      background-color: #0b0f0c;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>

</head>

<body>
  <h1 class="sr-only">Local Music - 本地音乐播放器</h1>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
